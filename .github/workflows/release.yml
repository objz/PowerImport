name: Release

on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Find Visual Studio
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vs) { throw "Visual Studio with MSBuild was not found" }
          "VS_PATH=$vs" >> $env:GITHUB_ENV

      - name: Restore NuGet packages
        run: nuget restore packages.config -PackagesDirectory packages -NonInteractive

      - name: Build add-in (Release)
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=PowerImport" -CertStoreLocation Cert:\CurrentUser\My -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -NotBefore (Get-Date).AddMinutes(-5) -NotAfter (Get-Date).AddYears(5)
          try {
            & "$env:VS_PATH\MSBuild\Current\Bin\MSBuild.exe" PowerImport.csproj /t:Rebuild /p:Configuration=Release /p:VisualStudioVersion=17.0 /p:ManifestCertificateThumbprint=$($cert.Thumbprint) /m /v:minimal
            if ($LASTEXITCODE -ne 0) { throw "Add-in build failed with exit code $LASTEXITCODE" }
          } finally {
            Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force
          }

      - name: Build installer (Release)
        timeout-minutes: 20
        shell: pwsh
        run: |
          $disableDir = "$env:VS_PATH\Common7\IDE\CommonExtensions\Microsoft\VSI\DisableOutOfProcBuild"
          Push-Location $disableDir
          & .\DisableOutOfProcBuild.exe
          $disableExit = $LASTEXITCODE
          Pop-Location
          if ($disableExit -ne 0) { throw "DisableOutOfProcBuild failed with exit code $disableExit" }

          try {
            & "$env:VS_PATH\Common7\IDE\devenv.com" "$env:GITHUB_WORKSPACE\Installer\Installer.vdproj" /Rebuild Release
            if ($LASTEXITCODE -ne 0) { throw "Installer build failed with exit code $LASTEXITCODE" }
          } finally {
            Push-Location $disableDir
            & .\DisableOutOfProcBuild.exe undo
            $undoExit = $LASTEXITCODE
            Pop-Location
            if ($undoExit -ne 0) { throw "Restoring out-of-process build failed with exit code $undoExit" }
          }

      - name: Verify outputs
        shell: pwsh
        run: |
          foreach ($f in @("bin/Release/PowerImport.dll", "bin/Release/PowerImport.vsto", "bin/Release/PowerImport.dll.manifest", "Installer/Release/PowerImport.msi")) {
            if (-not (Test-Path $f)) { throw "Missing build output: $f" }
          }
          Write-Host "All build outputs present."

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: PowerImport 1.1.0
          tag_name: 1.1.0
          draft: false
          generate_release_notes: true
          files: |
            Installer/Release/PowerImport.msi
