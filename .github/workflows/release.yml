name: Release

on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build add-in and installer (Release)
        # Use the classic MSBuild that ships with VS 2022 BuildTools (17.10.x), not the
        # newer MSBuild 17.14 that setup-msbuild puts on PATH. 17.14 dropped support
        # for packages.config restore, which breaks this legacy project. The classic
        # MSBuild restores packages.config natively and builds the .vdproj in one pass.
        run: '& "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin\msbuild.exe" PowerImport.sln /t:Restore,Rebuild /p:Configuration=Release /p:VisualStudioVersion=17.0 /m /v:minimal'

      - name: Verify outputs
        shell: pwsh
        run: |
          foreach ($f in @("bin/Release/PowerImport.dll", "bin/Release/PowerImport.vsto", "bin/Release/PowerImport.dll.manifest", "Installer/Release/PowerImport.msi")) {
            if (-not (Test-Path $f)) { throw "Missing build output: $f" }
          }
          Write-Host "All build outputs present."

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: PowerImport 1.1.0
          tag_name: 1.1.0
          draft: false
          generate_release_notes: true
          files: |
            Installer/Release/PowerImport.msi
